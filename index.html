<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AFK LPC Hero Game - An exciting idle hero game with pixel art characters."
    />
    <meta name="keywords" content="AFK, LPC, Hero, Game, Idle, Pixel Art" />
    <meta name="author" content="Mosberg" />

    <title>AFK LPC Hero Game</title>

    <link rel="icon" href="src/assets/lpc_2.webp" type="image/x-icon" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__title">AFK LPC Hero Game</div>
      <div class="header__resources">
        <span class="resource">Gold: <span id="gold">0</span></span>
        <span class="resource">Gems: <span id="gems">0</span></span>
      </div>
    </header>

    <main class="main">
      <section class="stage-section">
        <h2 class="section-title">Stage</h2>
        <div class="stage-view" id="stageView">
          <div class="stage-view__party" id="partyView"></div>
          <div class="stage-view__enemies" id="enemiesView"></div>
        </div>
        <div class="stage-controls">
          <button id="btnNextStage" class="btn">Next Stage</button>
          <button id="btnAutoBattle" class="btn">Toggle Auto</button>
        </div>
      </section>

      <section class="heroes-section">
        <h2 class="section-title">Heroes</h2>
        <div class="heroes-list" id="heroesList"></div>
      </section>

      <section class="log-section">
        <h2 class="section-title">Battle Log</h2>
        <div class="battle-log" id="battleLog"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__text">Built with LPC assets • Mosberg</div>
    </footer>

    <script type="module" src="src/scripts/main.js"></script>
  </body>
</html>
